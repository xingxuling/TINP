name: External onboarding across hosted environments
on:
  push:
    branches: [codex/tinp-external-onboarding-v01]
    paths:
      - '.github/workflows/external-onboarding.yml'
      - 'scripts/verify-external-batch.mjs'
      - 'sdk/**'
      - 'src/opp-*.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      summary-hash: ${{ steps.bind.outputs.summary-hash }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: xingxuling/OPP
          ref: 7c4970cd1f19ffcbc3f90ac6ed39ff0ab9364d45
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Build and install OPP wheel and pinned external libraries
        run: |
          python -m pip wheel --no-deps . -w /tmp/opp-wheels
          python -m venv /tmp/opp-env
          /tmp/opp-env/bin/python -m pip install /tmp/opp-wheels/*.whl -r examples/external-projects/requirements.txt
      - name: Execute real libraries from the installed wheel
        run: /tmp/opp-env/bin/python -I scripts/verify_external_projects.py --out /tmp/opp-evidence
      - name: Bind transferred evidence outside its payload
        id: bind
        run: |
          python -c "import hashlib,os; from pathlib import Path; digest=hashlib.sha256(Path('/tmp/opp-evidence/summary.json').read_bytes()).hexdigest(); Path(os.environ['GITHUB_OUTPUT']).write_text('summary-hash='+digest+'\n')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: opp-linux-evidence
          path: /tmp/opp-evidence
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: produce
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: opp-linux-evidence
          path: transferred
      - name: Verify roots, actual library receipts, recovery and tamper rejection
        env:
          EXPECTED_SUMMARY_SHA256: ${{ needs.produce.outputs.summary-hash }}
        shell: bash
        run: node scripts/verify-external-batch.mjs transferred acceptance.json "$EXPECTED_SUMMARY_SHA256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tinp-acceptance-${{ matrix.os }}
          path: acceptance.json
          if-no-files-found: error
          retention-days: 14
